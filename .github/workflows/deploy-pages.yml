name: Déployer le frontend sur GitHub Pages

# Ne déploie QUE le frontend (le site statique React/Vite). Le backend
# (Express + clé Apify + stockage des workers) n'est pas concerné : GitHub
# Pages ne fait tourner aucun serveur, donc l'API doit être hébergée
# ailleurs (Render, Railway, un VPS...). Une fois ce backend en ligne,
# renseigne son URL dans une variable de repo "VITE_API_URL"
# (Settings > Secrets and variables > Actions > Variables) pour que le
# frontend déployé sache où l'appeler.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

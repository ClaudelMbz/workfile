# Blueprint Render — sert à créer le service en un clic depuis le repo GitHub
# (New + > Blueprint sur dashboard.render.com). Ne contient aucune clé : le
# token Apify se saisit dans le dashboard Render, jamais ici.
services:
  - type: web
    name: workfile-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: APIFY_TOKEN
        sync: false
